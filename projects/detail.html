<style>
.proj-hero{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.proj-hero .badge{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.proj-hero h1{font-size:20px}
.proj-hero .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.proj-section{margin-top:18px}
.proj-section h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.proj-section h2::before{content:"";width:3px;height:14px;background:var(--brand);border-radius:2px}
.proj-desc{line-height:1.8;color:var(--muted)}
.io-tbl{width:100%;border-collapse:collapse;font-size:13px}
.io-tbl th,.io-tbl td{padding:8px 12px;border:1px solid var(--line);text-align:left}
.io-tbl th{background:var(--panel-2);font-weight:600;font-size:12px;color:var(--muted)}
.io-tbl tr:nth-child(even) td{background:var(--tbl-alt)}
.io-tbl .dir-in{color:var(--cyan);font-weight:600}
.io-tbl .dir-out{color:var(--ok);font-weight:600}
.prog-structure{display:flex;flex-direction:column;gap:8px}
.prog-block{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel-2)}
.prog-block .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-block .block-name{font-family:var(--font-mono);font-weight:600;font-size:13px}
.prog-block .block-type{font-size:11px;color:var(--muted)}
.prog-block .block-desc{font-size:12px;color:var(--muted);line-height:1.6}
.sim-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sim-actions .btn{padding:10px 18px;font-size:14px}
.sim-actions .btn.primary{background:var(--brand);color:#fff}
.sim-actions .btn.ok{background:var(--ok);color:#fff}
.sim-actions .btn.warn{background:var(--warn);color:#fff}
.quick-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.quick-nav a{padding:4px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--panel-2);transition:all .15s}
.quick-nav a:hover{border-color:var(--brand);background:var(--brand-soft)}
.not-found{text-align:center;padding:60px 20px;color:var(--muted)}
.not-found h2{margin-bottom:10px}
</style>

        {name:'OB1', type:'组织块', desc:'主程序：安全逻辑 + 标准逻辑并行'},
        {name:'F_ESTOP', type:'F 功能块', desc:'急停安全回路：双通道检测、差异时间监控、F_DIS 输出'},
        {name:'F_2W_DOOR', type:'F 功能块', desc:'安全门监控：双通道门开关检测、门未闭合时禁止启动'},
        {name:'F_MUTE', type:'F 功能块', desc:'光栅启动抑制：光栅触发时禁止设备启动'},
        {name:'DB_Safety', type:'数据块', desc:'安全参数：差异时间、屏蔽时间、验证记录'}
      ],
      simLink: '',
      simPreset: '',
      simLabel: ''
    }
  };

  function getParam(name){
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  function render(){
    const id = getParam('id');
    const root = document.getElementById('detailRoot');
    if(!id || !projects[id]){
      root.innerHTML = '<div class="not-found"><h2>❓ 项目未找到</h2><p>请返回<a href="index.html">项目库</a>选择有效项目。</p></div>';
      return;
    }
    const p = projects[id];
    document.title = p.title + ' · 博途学习站';

    const tagColors = {cyan:'var(--cyan)', brand:'var(--brand)', ok:'var(--ok)', warn:'var(--warn)'};
    const badgeColor = tagColors[p.levelClass] || 'var(--brand)';

    let quickNavHtml = '';
    if(p.simLink){
      quickNavHtml += `<a href="${p.simLink}${p.simPreset ? '?preset='+p.simPreset : ''}" target="_blank">${p.simLabel}</a>`;
    }
    if(p.sclLink){
      quickNavHtml += `<a href="${p.sclLink}" target="_blank">📄 SCL 源文件</a>`;
    }
    quickNavHtml += `<a href="index.html">← 返回项目库</a>`;

    let ioHtml = p.ioTable.map(function(row){
      const dirClass = row[2] === 'DI' || row[2] === 'F-DI' ? 'dir-in' : (row[2] === 'DO' || row[2] === 'F-DO' ? 'dir-out' : '');
      const dirLabel = row[2];
      return `<tr><td>${row[0]}</td><td>${row[1]}</td><td class="${dirClass}">${dirLabel}</td><td>${row[3]}</td><td>${row[4]}</td></tr>`;
    }).join('');

    let progHtml = p.structure.map(function(b){
      return `<div class="prog-block"><div class="block-head"><span class="block-name">${b.name}</span><span class="block-type">${b.type}</span></div><div class="block-desc">${b.desc}</div></div>`;
    }).join('');

    let simActionsHtml = '';
    if(p.simLink){
      simActionsHtml += `<a href="${p.simLink}${p.simPreset ? '?preset='+p.simPreset : ''}" class="btn ok btn-block" style="text-align:center">${p.simLabel}</a>`;
    }
    if(p.sclLink){
      simActionsHtml += `<a href="${p.sclLink}" class="btn btn-block" style="text-align:center">📄 下载 SCL 源文件</a>`;
    }

    root.innerHTML = `
      <div class="quick-nav">${quickNavHtml}</div>
      <div class="proj-hero">
        <div class="badge" style="background:${badgeColor}">${p.code}</div>
        <div>
          <h1>${p.title}</h1>
          <div class="tags">
            <span class="tag ${p.levelClass}">${p.level}</span>
            ${p.tags.map(function(t){ return '<span class="tag">'+t+'</span>'; }).join('')}
          </div>
        </div>
      </div>

      <div class="proj-section">
        <h2>📋 项目概述</h2>
        <p class="proj-desc">${p.desc}</p>
        <div class="sim-actions">
          ${simActionsHtml}
        </div>
      </div>

      <div class="proj-section">
        <h2>🔌 IO 分配表</h2>
        <table class="io-tbl">
          <thead><tr><th>地址</th><th>信号名</th><th>类型</th><th>模块/通道</th><th>说明</th></tr></thead>
          <tbody>${ioHtml}</tbody>
        </table>
      </div>

      <div class="proj-section">
        <h2>🏗 程序结构</h2>
        <div class="prog-structure">${progHtml}</div>
      </div>

      ${p.simLink || p.sclLink ? `
      <div class="proj-section">
        <h2>🔗 快速链接</h2>
        <div class="sim-actions">
          ${p.simLink ? `<a href="${p.simLink}${p.simPreset ? '?preset='+p.simPreset : ''}" class="btn ok btn-block" style="text-align:center">${p.simLabel}</a>` : ''}
          ${p.sclLink ? `<a href="${p.sclLink}" class="btn btn-block" style="text-align:center">📄 下载 SCL</a>` : ''}
        </div>
      </div>` : ''}
    `;
  }

  render();
})();
</script>
</body>
</html>
